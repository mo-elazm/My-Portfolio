		<script>
			// Always start fresh at the hero, even after a refresh deep in the page.
			if ("scrollRestoration" in window.history) {
				window.history.scrollRestoration = "manual";
			}
			window.scrollTo(0, 0);
		</script>
		<script>
			(() => {
				try {
					const saved = JSON.parse(localStorage.getItem("mo-portfolio-preferences") || "{}");
					const theme = saved?.state?.theme;
					const language = saved?.state?.language;
					const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
					const resolvedTheme = theme || (prefersLight ? "light" : "dark");
					const resolvedLanguage = language === "ar" ? "ar" : "en";

					document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
					document.documentElement.dataset.theme = resolvedTheme;
					document.documentElement.lang = resolvedLanguage;
					document.documentElement.dir = resolvedLanguage === "ar" ? "rtl" : "ltr";
				} catch {
					document.documentElement.classList.add("dark");
				}
			})();
		</script>
